<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#gradient1)" opacity="0.1"/>
  
  <!-- Map Pin -->
  <g transform="translate(150, 100)">
    <path d="M50 0C22.4 0 0 22.4 0 50C0 87.5 50 150 50 150C50 150 100 87.5 100 50C100 22.4 77.6 0 50 0Z" fill="url(#gradient2)"/>
    <circle cx="50" cy="50" r="20" fill="white"/>
  </g>
  
  <!-- Route Line -->
  <path d="M100 250 Q 200 200 300 250" stroke="url(#gradient3)" stroke-width="3" fill="none" stroke-dasharray="8 4"/>
  
  <!-- Car Icon -->
  <g transform="translate(80, 230)">
    <rect x="0" y="15" width="40" height="20" rx="4" fill="url(#gradient2)"/>
    <circle cx="10" cy="38" r="6" fill="#1e293b"/>
    <circle cx="30" cy="38" r="6" fill="#1e293b"/>
    <path d="M5 15 L10 5 L30 5 L35 15" fill="url(#gradient2)"/>
  </g>
  
  <!-- Plane Icon -->
  <g transform="translate(270, 170)">
    <path d="M20 10 L35 25 L40 23 L30 8 L32 6 L46 12 L50 10 L38 -5 L34 -5 L28 8 L20 5 L18 7 L22 15 L15 18 L12 16 L10 18 L14 24 L20 22 Z" fill="url(#gradient4)" transform="rotate(45 30 15)"/>
  </g>
  
  <!-- Train Icon -->
  <g transform="translate(150, 260)">
    <rect x="0" y="0" width="50" height="35" rx="5" fill="url(#gradient3)"/>
    <rect x="5" y="5" width="18" height="18" rx="2" fill="white" opacity="0.9"/>
    <rect x="27" y="5" width="18" height="18" rx="2" fill="white" opacity="0.9"/>
    <circle cx="12" cy="32" r="4" fill="#1e293b"/>
    <circle cx="38" cy="32" r="4" fill="#1e293b"/>
  </g>
  
  <!-- Compass Decorator -->
  <g transform="translate(280, 80)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="url(#gradient4)" stroke-width="2" opacity="0.6"/>
    <path d="M25 5 L28 25 L25 45 L22 25 Z" fill="url(#gradient4)" opacity="0.7"/>
    <path d="M5 25 L25 28 L45 25 L25 22 Z" fill="url(#gradient2)" opacity="0.7"/>
  </g>
  
  <!-- Decorative Dots -->
  <circle cx="340" cy="320" r="4" fill="#6366f1" opacity="0.3"/>
  <circle cx="60" cy="80" r="3" fill="#14b8a6" opacity="0.4"/>
  <circle cx="320" cy="140" r="5" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="90" cy="350" r="4" fill="#06b6d4" opacity="0.4"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
