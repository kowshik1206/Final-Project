<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#smart-gradient)" opacity="0.1"/>
  
  <!-- Brain/Intelligence Icon Center -->
  <g transform="translate(200, 180)">
    <ellipse cx="0" cy="0" rx="60" ry="55" fill="none" stroke="url(#brain-gradient)" stroke-width="3"/>
    
    <!-- Brain Pathways -->
    <path d="M-30 -20 Q-20 -10 -10 -20" stroke="url(#brain-gradient)" stroke-width="2.5" fill="none"/>
    <path d="M10 -20 Q20 -10 30 -20" stroke="url(#brain-gradient)" stroke-width="2.5" fill="none"/>
    <path d="M-35 0 Q-25 10 -15 0" stroke="url(#brain-gradient)" stroke-width="2.5" fill="none"/>
    <path d="M15 0 Q25 10 35 0" stroke="url(#brain-gradient)" stroke-width="2.5" fill="none"/>
    <path d="M-25 20 Q-15 30 -5 20" stroke="url(#brain-gradient)" stroke-width="2.5" fill="none"/>
    <path d="M5 20 Q15 30 25 20" stroke="url(#brain-gradient)" stroke-width="2.5" fill="none"/>
    
    <!-- Center Glow -->
    <circle cx="0" cy="0" r="15" fill="url(#glow-gradient)" opacity="0.6"/>
    <circle cx="0" cy="0" r="8" fill="url(#brain-gradient)"/>
  </g>
  
  <!-- Data Points Around -->
  <g transform="translate(200, 180)">
    <!-- Top -->
    <circle cx="0" cy="-100" r="12" fill="url(#data-gradient1)" opacity="0.9"/>
    <path d="M0 -88 L0 -65" stroke="url(#data-gradient1)" stroke-width="2" stroke-dasharray="4 2"/>
    <g transform="translate(0, -100)">
      <path d="M-6 -4 L0 4 L6 -4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Right -->
    <circle cx="90" cy="0" r="12" fill="url(#data-gradient2)" opacity="0.9"/>
    <path d="M78 0 L65 0" stroke="url(#data-gradient2)" stroke-width="2" stroke-dasharray="4 2"/>
    <g transform="translate(90, 0)">
      <circle cx="0" cy="-3" r="2" fill="white"/>
      <circle cx="0" cy="3" r="2" fill="white"/>
    </g>
    
    <!-- Bottom -->
    <circle cx="0" cy="100" r="12" fill="url(#data-gradient3)" opacity="0.9"/>
    <path d="M0 88 L0 65" stroke="url(#data-gradient3)" stroke-width="2" stroke-dasharray="4 2"/>
    <g transform="translate(0, 100)">
      <rect x="-4" y="-4" width="8" height="8" fill="white" rx="1"/>
    </g>
    
    <!-- Left -->
    <circle cx="-90" cy="0" r="12" fill="url(#data-gradient4)" opacity="0.9"/>
    <path d="M-78 0 L-65 0" stroke="url(#data-gradient4)" stroke-width="2" stroke-dasharray="4 2"/>
    <g transform="translate(-90, 0)">
      <path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Lightbulb Icon (Top Left) -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="25" fill="url(#bulb-gradient)" opacity="0.15"/>
    <path d="M0 -15 C8 -15 15 -8 15 0 C15 5 12 8 10 12 L-10 12 C-12 8 -15 5 -15 0 C-15 -8 -8 -15 0 -15 Z" 
          fill="url(#bulb-gradient)"/>
    <rect x="-6" y="12" width="12" height="4" rx="1" fill="url(#bulb-gradient)" opacity="0.7"/>
    <path d="M-3 -8 L0 -20" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Shield Icon (Top Right) -->
  <g transform="translate(320, 80)">
    <path d="M0 -20 L15 -15 L15 0 C15 10 7 18 0 20 C-7 18 -15 10 -15 0 L-15 -15 Z" 
          fill="url(#shield-gradient)"/>
    <path d="M-8 -2 L-3 3 L8 -8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Rocket Icon (Bottom Right) -->
  <g transform="translate(320, 320)">
    <path d="M0 -20 L8 10 L4 12 L0 8 L-4 12 L-8 10 Z" fill="url(#rocket-gradient)"/>
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="white" opacity="0.8"/>
    <path d="M-10 10 L-6 16" stroke="url(#rocket-gradient)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10 10 L6 16" stroke="url(#rocket-gradient)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Clock Icon (Bottom Left) -->
  <g transform="translate(80, 320)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#clock-gradient)" stroke-width="2.5"/>
    <path d="M0 -10 L0 0 L8 4" stroke="url(#clock-gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Floating Particles -->
  <circle cx="150" cy="90" r="2.5" fill="#6366f1" opacity="0.4">
    <animate attributeName="cy" values="90;85;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="110" r="3" fill="#14b8a6" opacity="0.4">
    <animate attributeName="cy" values="110;105;110" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="260" r="2" fill="#8b5cf6" opacity="0.4">
    <animate attributeName="cy" values="260;255;260" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="240" r="2.5" fill="#06b6d4" opacity="0.4">
    <animate attributeName="cy" values="240;235;240" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="smart-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brain-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow-gradient">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.2" />
    </radialGradient>
    <linearGradient id="data-gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="data-gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="data-gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="data-gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bulb-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shield-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rocket-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clock-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
